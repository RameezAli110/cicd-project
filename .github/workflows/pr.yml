name: Create Pull Request and Notify

on:
  push:
    branches-ignore:
      - main

jobs:
  auto-pull-request:
    name: PullRequestAction
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create Pull Request
        id: create_pr
        uses: diillson/auto-pull-request@v1.0.1
        with:
          source_branch: ""
          destination_branch: "main"
          pr_title: "Pulling ${{ github.ref }} into main"
          pr_body: |
            # An automated PR

            This pull request has been created automatically by the workflow.

            Please review the changes and merge if acceptable.

          pr_assignee: "RameezAli110"
          pr_label: "auto-pr"
          pr_allow_empty: true
          github_token: ${{ secrets.TOKEN }}

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "Approval required for Pull Request #${{ steps.create_pr.outputs.pull-request-number }}"

          body: |
            A new Pull Request has been created.

            Repository: ${{ github.repository }}

            Branch: ${{ github.ref_name }}

            PR Number: #${{ steps.create_pr.outputs.pull-request-number }}

            Review & approve here:
            https://github.com/${{ github.repository }}/pull/${{ steps.create_pr.outputs.pull-request-number }}

          to: rameezalee102@gmail.com
          from: rameezalee102@gmail.com
